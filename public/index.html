<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b2d" />
    <title>TaskFlow | Focused work, shipped</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">TaskFlow</p>
          <h1>Stay organized. Ship work faster.</h1>
          <p class="subtitle">
            A simple task manager built with HTML, CSS, JavaScript, Node.js, and Express.
            CI/CD pipeline demo build.
          </p>
        </div>
        <div class="status-card" id="health-card">
          <span class="status-dot" id="health-dot"></span>
          <div>
            <p class="status-label">API Status</p>
            <p class="status-value" id="health-text">Checking...</p>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="panel">
          <h2>Add a task</h2>
          <form id="task-form">
            <label for="task-input">What do you need to do?</label>
            <div class="form-row">
              <input
                id="task-input"
                type="text"
                name="title"
                maxlength="200"
                placeholder="Example: Review CI/CD pipeline notes"
                required
              />
              <button type="submit">Add Task</button>
            </div>
            <p class="form-error" id="form-error" hidden></p>
          </form>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Your tasks</h2>
            <p class="task-count" id="task-count">0 tasks</p>
          </div>
          <ul class="task-list" id="task-list"></ul>
          <p class="empty-state" id="empty-state">No tasks yet. Add your first task above.</p>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
